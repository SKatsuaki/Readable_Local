name: readable-loacal

services:
  app:
    build:
      context: .
    image: readable-loacal-app:latest
    restart: unless-stopped
    ports:
      - "0.0.0.0:${READABLE_PORT:-8766}:8766"
    environment:
      OLLAMA_HOST: http://ollama:11434
      NMT_HOST: http://nmt:8767
      HOST: 0.0.0.0
      PORT: 8766
      READABLE_TMP_DIR: /tmp/readable/tmp
      READABLE_OUTPUT_DIR: /tmp/readable/output
      READABLE_RECOVER_OUTPUTS: "0"
      READABLE_MAX_CONCURRENT_JOBS: "${READABLE_MAX_CONCURRENT_JOBS:-4}"
      READABLE_MAX_QUEUED_JOBS: "${READABLE_MAX_QUEUED_JOBS:-2}"
      READABLE_DYNAMIC_JOB_LIMITS: "${READABLE_DYNAMIC_JOB_LIMITS:-1}"
      READABLE_MEMORY_BUDGET_GB: "${READABLE_MEMORY_BUDGET_GB:-100}"
      READABLE_MIN_FREE_MEMORY_GB: "${READABLE_MIN_FREE_MEMORY_GB:-8}"
      READABLE_JOB_MEMORY_RESERVE_GB: "${READABLE_JOB_MEMORY_RESERVE_GB:-20}"
      READABLE_JOB_TTL_SECONDS: "${READABLE_JOB_TTL_SECONDS:-1800}"
      READABLE_MAX_UPLOAD_MB: "${READABLE_MAX_UPLOAD_MB:-300}"
      READABLE_OLLAMA_TIMEOUT_SECONDS: "${READABLE_OLLAMA_TIMEOUT_SECONDS:-900}"
      READABLE_NMT_TIMEOUT_SECONDS: "${READABLE_NMT_TIMEOUT_SECONDS:-600}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    depends_on:
      - ollama
      - nmt
    gpus: all
    tmpfs:
      - /tmp/readable:rw,nosuid,nodev,size=${READABLE_TMPFS_SIZE:-8g},mode=1777

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_FLASH_ATTENTION: "${OLLAMA_FLASH_ATTENTION:-1}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
    volumes:
      - ollama_models:/root/.ollama
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=${OLLAMA_TMPFS_SIZE:-4g}

  nmt:
    build:
      context: .
      dockerfile: nmt.Dockerfile
    image: readable-loacal-nmt:latest
    restart: unless-stopped
    gpus: all
    environment:
      NMT_MODEL_ID: facebook/nllb-200-distilled-600M
      NMT_MODEL_DIR: /models/nllb-200-distilled-600m
      HF_HOME: /models/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - nmt_models:/models

volumes:
  ollama_models:
  nmt_models:
